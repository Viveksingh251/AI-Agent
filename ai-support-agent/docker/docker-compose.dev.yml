services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - ../app:/app/app
      - ../agent:/app/agent
      - ../rag:/app/rag
      - ../database:/app/database
      - ../api:/app/api
      - ../tests:/app/tests
    environment:
      - APP_ENV=development
      - DEBUG=true

