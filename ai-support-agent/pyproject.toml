[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ai-support-agent"
version = "0.1.0"
description = "Production-ready Customer Support AI Agent powered by LangGraph, FastAPI, and RAG."
authors = ["AI Engineering Team <engineering@example.com>"]
readme = "README.md"
packages = [{include = "app"}, {include = "agent"}, {include = "rag"}, {include = "database"}, {include = "api"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.8.0"
pydantic-settings = "^2.3.0"
langchain = "^0.2.10"
langchain-core = "^0.2.20"
langchain-openai = "^0.1.16"
langchain-community = "^0.2.9"
langgraph = "^0.1.14"
langsmith = "^0.1.90"
sqlalchemy = "^2.0.31"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
pgvector = "^0.3.2"
alembic = "^1.13.2"
qdrant-client = "^1.10.1"
tiktoken = "^0.7.0"
httpx = "^0.27.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
streamlit = "^1.36.0"
redis = "^5.0.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.8"
pytest-cov = "^5.0.0"
black = "^24.4.2"
ruff = "^0.5.4"
mypy = "^1.10.1"
pre-commit = "^3.7.1"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

