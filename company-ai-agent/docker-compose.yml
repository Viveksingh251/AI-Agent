services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: company-ai-agent
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Company AI Agent
      - APP_ENV=production
      - DEBUG=false
      - PORT=8000
      - HOST=0.0.0.0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - DATABASE_URL=sqlite+aiosqlite:///./data/company_agent.db
    volumes:
      - agent_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agent_data:
    driver: local

