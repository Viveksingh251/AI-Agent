name: Continuous Integration & Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Linting and Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: Lint code with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Test Suite
        env:
          APP_ENV: testing
          LLM_PROVIDER: mock
          DATABASE_URL: sqlite+aiosqlite:///:memory:
        run: |
          pytest -v --tb=short

  build-and-deploy:
    name: Build & Verify Docker Container
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: company-ai-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Startup & Healthcheck
        run: |
          docker run -d --name test-agent -p 8000:8000 company-ai-agent:latest
          sleep 5
          docker ps
          curl --fail http://localhost:8000/health || (docker logs test-agent && exit 1)
          docker stop test-agent

